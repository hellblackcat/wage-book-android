name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip \
            libgirepository1.0-dev \
            gir1.2-gtk-3.0 \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libfreetype6-dev \
            libpng-dev \
            openjdk-17-jdk \
            unzip \
            wget

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install kivy kivymd buildozer

      - name: Build debug APK
        run: buildozer android debug
        env:
          BUILDZEROCOLOR: "0.6"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wage-book-apk
          path: bin/*.apk
          retention-days: 14
